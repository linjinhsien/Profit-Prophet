  description: >
    AI-driven voice assistant for caregivers. Caregivers ask questions in
    Mandarin (voice or text); the system retrieves answers from the care
    knowledge base (RAG), automatically classifies Care Events, and responds
    with synthesized speech.
  version: v2
  started: "2026-08-01"
  last_verified: "2026-08-02T20:35:00+08:00"
  live_demo: https://d1qintm5rk17ye.cloudfront.net
  repository: https://github.com/linjinhsien/Profit-Prophet

