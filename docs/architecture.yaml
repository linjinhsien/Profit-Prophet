bedrock:
  region: us-west-2
  llm:
    model_id: us.anthropic.claude-sonnet-4-20250514-v1:0
    model_name: Claude Sonnet 4
    confirmed_by: Lambda env var BEDROCK_MODEL_ID
    use_cases:
      - RAG question answering (RetrieveAndGenerate)
      - Care Event classification (structured output)
      - Conversation summarization
  knowledge_base:
    id: H4NWXXP6DZ
    name: profit-prophet-care-kb
    status: ACTIVE
    description: >
      照護知識庫 — 長者健康照護、失智症、用藥管理、營養睡眠、緊急處理
    embedding_model: amazon.titan-embed-text-v2:0
    embedding_dimensions: 1024
    vector_store: opensearch_serverless
    rag_api: RetrieveAndGenerate

