# =============================================================================
# AUTHENTICATION LAYER
# =============================================================================
cognito:
  identity_pool_id: us-west-2:5cc123d7-c990-41a7-b887-62c67264ea71
  identity_pool_name: profit-prophet-frontend
  region: us-west-2
  status: Active
  roles:
    unauthenticated: arn:aws:iam::056724761684:role/profit-prophet-cognito-unauth
  description: >
    Provides temporary AWS credentials for the browser frontend.
    Guest (unauthenticated) identity flow — no login required for PoC.
    IAM role grants minimum permissions to call Transcribe, Bedrock, Polly, DynamoDB.

iam:
  roles:
    - name: profit-prophet-cognito-unauth
      type: unauthenticated_cognito
      permissions:
        - service: transcribe
          actions: [TranscribeStreaming:StartStreamTranscription]
          resources: ["*"]
        - service: bedrock
          actions:
            - bedrock:RetrieveAndGenerate
            - bedrock:Retrieve
            - bedrock:InvokeModel
          resources:
            - arn:aws:bedrock:us-west-2:056724761684:knowledge-base/H4NWXXP6DZ
            - arn:aws:bedrock:us-west-2::foundation-model/*
        - service: polly
          actions: [polly:SynthesizeSpeech]
          resources: ["*"]
        - service: dynamodb
          actions:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
          resources:
            - arn:aws:dynamodb:us-west-2:056724761684:table/profit-prophet-conversations
    - name: profit-prophet-bedrock-kb
      type: service_role
      description: Allows Bedrock to read S3 and write to AOSS for Knowledge Base
      permissions:
        - service: s3
          actions: [s3:GetObject, s3:ListBucket]
        - service: aoss
          actions: [aoss:APIAccessAll]

