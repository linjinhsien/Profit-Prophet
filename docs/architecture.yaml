  collection_id: 5jbmcmvs9c1fwxf0mxxe
  type: VECTORSEARCH
  region: us-west-2
  status: ACTIVE
  standby_replicas: ENABLED
  deletion_protection: DISABLED
  created: "2026-08-02T09:46:00+08:00"  # CloudTrail confirmed CreateCollection
  confirmed_by: CloudTrail CreateCollection event 2026-08-02 09:46 UTC+8
  endpoints:
    collection: https://5jbmcmvs9c1fwxf0mxxe.us-west-2.aoss.amazonaws.com
