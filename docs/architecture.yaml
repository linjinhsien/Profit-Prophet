# =============================================================================
# SECURITY LIMITATIONS (PoC)
# =============================================================================
security:
  limitations:
    - issue: No server-side rate limiting
      impact: Bedrock cost abuse risk
      mitigation: IAM resource-level permissions as only guardrail
    - issue: Unauthenticated Cognito flow
      impact: Any user can invoke AWS services
      mitigation: Minimum IAM permissions; resource ARN scoping
    - issue: EC2 direct exposure
      impact: t3.micro attack surface on port 8080
      mitigation: Security group sg-0cfc53dd6f829c67b; CloudFront as proxy
  recommendation: >
    Add backend layer (Lambda or Bedrock AgentCore) before production
    to handle rate limiting, input validation, and audit logging.

