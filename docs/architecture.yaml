ec2:
  instance_id: i-099c8061008241015
  instance_type: t3.micro
  state: running
  region: us-west-2
  availability_zone: us-west-2a
  public_ip: 35.91.137.3
  public_dns: ec2-35-91-137-3.us-west-2.compute.amazonaws.com
