# =============================================================================
# DATA FLOW
# =============================================================================
data_flows:
  voice_query:
    description: User speaks → transcribed → answered → spoken back
    steps:
      - step: 1
        actor: Browser
        action: Capture microphone via Web Audio API
      - step: 2
        actor: Browser → EC2 (WebSocket /ws/transcribe)
        action: Stream PCM audio to LiveCaption WebSocket
      - step: 3
        actor: EC2 → Amazon Transcribe Streaming
        action: Forward audio stream, receive zh-TW transcript
      - step: 4
        actor: EC2 → Browser
        action: Return transcript text (partial + final results)
      - step: 5
        actor: Browser → Bedrock RetrieveAndGenerate
        action: Send transcript as query with KB ID H4NWXXP6DZ
      - step: 6
        actor: Bedrock → AOSS (caremate-ai-kb)
        action: Vector search on embedded query (Titan Embed v2, 1024 dims)
      - step: 7
        actor: Bedrock → Claude Sonnet 4
        action: Generate answer with retrieved context + classify Care Event
      - step: 8
        actor: Browser → Lambda (caremate-ai-speech-dev) → Polly
        action: Synthesize answer text to Zhiyu Neural MP3
      - step: 9
        actor: Browser
        action: Play MP3 audio response
      - step: 10
        actor: Browser → DynamoDB (profit-prophet-conversations)
        action: Persist conversation record (identityId + id keys)

  care_event_classification:
    description: Single Bedrock call returns answer + structured Care Event
    model: Claude Sonnet 4 (structured output)
    output_schema:
      - answer: string
      - care_event:
          type: enum  # [medication, nutrition, mobility, emotion, emergency, other]
          severity: enum  # [low, medium, high]
          summary: string

# =============================================================================
# ARCHITECTURE DECISIONS
# =============================================================================
decisions:
  - decision: No API Gateway / Lambda for main path
    v1: API Gateway + Lambda
    v2: Frontend calls AWS directly via Cognito credentials
    reason: Saves one deployment layer; sufficient for 24h PoC

  - decision: OpenSearch Serverless (AOSS) for vector store
    v1: OpenSearch Serverless (planned)
    v2: OpenSearch Serverless AOSS (actual, confirmed by CloudTrail)
    note: Earlier docs incorrectly stated S3 Vectors — corrected 2026-08-02

  - decision: EC2 instead of App Runner
    v1_plan: App Runner (serverless containers)
    v2_actual: EC2 t3.micro
    reason: LiveCaption requires persistent WebSocket connections; EC2 gives full control
    deployment_note: Rebuilt 5 times on 2026-08-01 20:13–20:40 UTC+8 to debug UserData

  - decision: Reject Amazon Nova Sonic
    reason: >
      Nova Sonic supports Chinese but with strong ABC accent (American-style Mandarin).
      Taiwan elder care requires natural Taiwan Mandarin (zh-TW) and Taiwanese.
      Maintained Transcribe Streaming (zh-TW) + Polly Zhiyu Neural instead.

  - decision: Claude Sonnet 4 over Haiku 4.5
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    reason: High-performance reasoning for complex care Q&A and structured classification
    corrected_from: Earlier docs incorrectly listed Claude Haiku 4.5 — fixed 2026-08-02

