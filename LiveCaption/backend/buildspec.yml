version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 056724761684.dkr.ecr.us-west-2.amazonaws.com
  build:
    commands:
      - echo Building Docker image...
      - docker build -t profit-prophet-backend .
      - docker tag profit-prophet-backend:latest 056724761684.dkr.ecr.us-west-2.amazonaws.com/profit-prophet-backend:latest
  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push 056724761684.dkr.ecr.us-west-2.amazonaws.com/profit-prophet-backend:latest
